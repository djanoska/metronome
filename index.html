<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyBeat - Web Audio Metronóm</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-strong: #1f6feb;
      --text: #c9d1d9;
      --text-bright: #ffffff;

      /* Kontrasztos pengetési színek */
      --strum-down: #ff3b56;       /* Élénkpiros */
      --strum-down-dim: rgba(255, 59, 86, 0.45);
      --strum-up: #00d2ee;         /* Elektromos cián */
      --strum-up-dim: rgba(0, 210, 238, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .metronome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    .tempo-display {
      text-align: center;
    }

    .bpm-input-wrapper {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .bpm-input {
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--text-bright);
      background: transparent;
      border: 1px dashed transparent;
      border-radius: 8px;
      text-align: center;
      width: 180px;
      padding: 0;
      outline: none;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .bpm-input:hover {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.03);
    }

    .bpm-input:focus {
      border-color: var(--accent);
      background: #0d1117;
      cursor: text;
    }

    .bpm-input::-webkit-outer-spin-button,
    .bpm-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .bpm-input[type=number] {
      -moz-appearance: textfield;
    }

    .bpm-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
      margin-top: 0.25rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .step-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .step-btn:hover { background: #30363d; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .button-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .toggle-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--accent-strong);
      border-color: var(--accent);
      color: var(--text-bright);
    }

    /* Pengetési sáv */
    .beat-indicators {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      min-height: 70px;
      align-items: center;
      background: #0d1117;
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    .beat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      transition: transform 0.08s ease;
    }

    .beat-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #21262d;
      border: 1px solid var(--border);
      transition: transform 0.08s, background-color 0.08s, box-shadow 0.08s;
    }

    .beat-dot.sub {
      width: 8px;
      height: 8px;
    }

    .strum-arrow {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      transition: transform 0.08s ease, color 0.08s ease, filter 0.08s ease;
      user-select: none;
    }

    /* Színkezelés: Nyugalmi állapot */
    .strum-down .strum-arrow {
      color: var(--strum-down-dim);
    }

    .strum-up .strum-arrow {
      color: var(--strum-up-dim);
    }

    /* Színkezelés: Aktív állapot (villanás) */
    .beat-col.active {
      transform: scale(1.15);
    }

    .beat-col.active.strum-down .beat-dot {
      background: var(--strum-down);
      border-color: var(--strum-down);
      box-shadow: 0 0 12px var(--strum-down);
    }

    .beat-col.active.strum-down .strum-arrow {
      color: var(--strum-down);
      filter: drop-shadow(0 0 8px var(--strum-down));
      transform: scale(1.3);
    }

    .beat-col.active.strum-up .beat-dot {
      background: var(--strum-up);
      border-color: var(--strum-up);
      box-shadow: 0 0 12px var(--strum-up);
    }

    .beat-col.active.strum-up .strum-arrow {
      color: var(--strum-up);
      filter: drop-shadow(0 0 8px var(--strum-up));
      transform: scale(1.3);
    }

    .action-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .primary-btn {
      background: #238636;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .primary-btn:hover { background: #2ea043; }
    .primary-btn.playing { background: #da3633; }
    .primary-btn.playing:hover { background: #f85149; }

    .tap-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tap-btn:active { background: #30363d; }
  </style>
</head>
<body>

  <main class="metronome-card">
    <div class="tempo-display">
      <div class="bpm-input-wrapper">
        <input type="number" id="bpmInput" class="bpm-input" min="1" max="240" value="120" title="Kattints a szerkesztéshez, majd nyomj Entert">
      </div>
      <div class="bpm-label">BPM (1 – 240) • Nyomj Enter-t a módosításhoz</div>
    </div>

    <div class="slider-row">
      <button class="step-btn" id="bpmMinus">−</button>
      <input type="range" id="bpmSlider" min="1" max="240" value="120">
      <button class="step-btn" id="bpmPlus">+</button>
    </div>

    <!-- Hangerő -->
    <div class="control-group">
      <div class="group-header">
        <span>Hangerő</span>
        <span id="volumeLabel">80%</span>
      </div>
      <div class="slider-row">
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>

    <!-- Ütemmutató -->
    <div class="control-group">
      <div class="group-header"><span>Ütemmutató</span></div>
      <div class="button-grid" id="beatsContainer">
        <button class="toggle-btn" data-beats="2">2/4</button>
        <button class="toggle-btn" data-beats="3">3/4</button>
        <button class="toggle-btn active" data-beats="4">4/4</button>
        <button class="toggle-btn" data-beats="6">6/8</button>
      </div>
    </div>

    <!-- Szubdivízió -->
    <div class="control-group">
      <div class="group-header"><span>Ritmikai felosztás</span></div>
      <div class="button-grid" id="subdivContainer">
        <button class="toggle-btn active" data-sub="1">Negyed</button>
        <button class="toggle-btn" data-sub="2">Nyolcad</button>
        <button class="toggle-btn" data-sub="3">Triola</button>
        <button class="toggle-btn" data-sub="4">Tizenhatod</button>
      </div>
    </div>

    <!-- Pengetés iránya -->
    <div class="control-group">
      <div class="group-header"><span>Pengetés iránya</span></div>
      <div class="button-grid-2" id="strumContainer">
        <button class="toggle-btn active" data-strum="alternate">
          Váltott (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-up)">↑</span>)
        </button>
        <button class="toggle-btn" data-strum="down">
          Csak le (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-down)">↓</span>)
        </button>
      </div>
    </div>

    <!-- Ütem és Pengetés Visszajelző Sáv -->
    <div class="beat-indicators" id="indicators"></div>

    <div class="action-row">
      <button class="primary-btn" id="playBtn">Indítás</button>
      <button class="tap-btn" id="tapBtn">TAP</button>
    </div>
  </main>

  <script>
    class MetronomeEngine {
      constructor() {
        this.audioCtx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.bpm = 120;
        this.beatsPerBar = 4;
        this.subdivision = 1; 
        this.strumPattern = 'alternate';
        this.volume = 0.8;

        this.scheduleAheadTime = 0.12;
        this.nextNoteTime = 0.0;
        this.currentStep = 0;

        this.bufferFirst = null;
        this.bufferBeat = null;
        this.bufferSub = null;

        this.notesInQueue = [];
        this.onTick = null;

        this.initWorker();
      }

      initWorker() {
        const workerCode = `
          let timer = null;
          self.onmessage = function(e) {
            if (e.data === 'start') {
              if (!timer) {
                timer = setInterval(() => self.postMessage('tick'), 25);
              }
            } else if (e.data === 'stop') {
              if (timer) {
                clearInterval(timer);
                timer = null;
              }
            }
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        this.timerWorker = new Worker(URL.createObjectURL(blob));
        this.timerWorker.onmessage = (e) => {
          if (e.data === 'tick') {
            this.scheduler();
          }
        };
      }

      createClickBuffer(freqStart, freqEnd, duration, decayRate, gainFactor = 1.0) {
        const sampleRate = this.audioCtx.sampleRate;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = this.audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);
        let phase = 0;

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t * decayRate);
          const currentFreq = freqEnd + (freqStart - freqEnd) * Math.exp(-t * 90);
          phase += (2 * Math.PI * currentFreq) / sampleRate;
          const noise = (Math.random() * 2 - 1) * Math.exp(-t * 150);
          data[i] = (Math.sin(phase) * 0.85 + noise * 0.15) * env * gainFactor;
        }
        return buffer;
      }

      initAudio() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContextClass();

          this.masterGain = this.audioCtx.createGain();
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
          this.masterGain.connect(this.audioCtx.destination);

          this.bufferFirst = this.createClickBuffer(1700, 800, 0.045, 95, 1.0);
          this.bufferBeat  = this.createClickBuffer(1200, 550, 0.035, 110, 0.75);
          this.bufferSub   = this.createClickBuffer(800, 400, 0.025, 140, 0.4);
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.masterGain && this.audioCtx) {
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
        }
      }

      setBpm(newBpm) {
        const clamped = Math.max(1, Math.min(240, Math.round(newBpm)));
        if (clamped === this.bpm) return;

        if (this.isPlaying && this.audioCtx) {
          const now = this.audioCtx.currentTime;
          const remaining = this.nextNoteTime - now;
          if (remaining > 0) {
            this.nextNoteTime = now + remaining * (this.bpm / clamped);
          }
        }
        this.bpm = clamped;
      }

      nextNote() {
        const secondsPerBeat = 60.0 / this.bpm;
        const secondsPerStep = secondsPerBeat / this.subdivision;

        this.nextNoteTime += secondsPerStep;
        this.currentStep++;

        const totalStepsInBar = this.beatsPerBar * this.subdivision;
        if (this.currentStep >= totalStepsInBar) {
          this.currentStep = 0;
        }
      }

      scheduleNote(stepNumber, time) {
        this.notesInQueue.push({ step: stepNumber, time: time });

        const source = this.audioCtx.createBufferSource();
        const isBeat = (stepNumber % this.subdivision === 0);
        const isFirstBeat = (stepNumber === 0);

        if (isFirstBeat) {
          source.buffer = this.bufferFirst;
        } else if (isBeat) {
          source.buffer = this.bufferBeat;
        } else {
          source.buffer = this.bufferSub;
        }

        source.connect(this.masterGain);
        source.start(time);
      }

      scheduler() {
        if (!this.isPlaying) return;
        while (this.nextNoteTime < this.audioCtx.currentTime + this.scheduleAheadTime) {
          this.scheduleNote(this.currentStep, this.nextNoteTime);
          this.nextNote();
        }
      }

      start() {
        if (this.isPlaying) return;
        this.initAudio();
        this.isPlaying = true;
        this.currentStep = 0;
        this.nextNoteTime = this.audioCtx.currentTime + 0.05;
        this.notesInQueue = [];
        this.timerWorker.postMessage('start');
      }

      stop() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        this.timerWorker.postMessage('stop');
        this.notesInQueue = [];
      }

      updateVisuals() {
        if (!this.audioCtx) return;
        const currentTime = this.audioCtx.currentTime;

        while (this.notesInQueue.length > 0 && this.notesInQueue[0].time <= currentTime) {
          const currentNote = this.notesInQueue.shift();
          if (this.onTick) {
            this.onTick(currentNote.step);
          }
        }
      }
    }

    // --- FELÜLETI VEZÉRLÉS ---
    const metronome = new MetronomeEngine();

    const bpmInput = document.getElementById('bpmInput');
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmMinus = document.getElementById('bpmMinus');
    const bpmPlus = document.getElementById('bpmPlus');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const playBtn = document.getElementById('playBtn');
    const tapBtn = document.getElementById('tapBtn');
    const indicatorsContainer = document.getElementById('indicators');

    function updateBpm(newBpm) {
      metronome.setBpm(newBpm);
      bpmSlider.value = metronome.bpm;
      bpmInput.value = metronome.bpm;
    }

    bpmSlider.addEventListener('input', (e) => updateBpm(parseInt(e.target.value, 10)));
    bpmMinus.addEventListener('click', () => updateBpm(metronome.bpm - 1));
    bpmPlus.addEventListener('click', () => updateBpm(metronome.bpm + 1));

    bpmInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        updateBpm(parseInt(bpmInput.value, 10) || 120);
        bpmInput.blur();
      }
    });
    bpmInput.addEventListener('blur', () => {
      updateBpm(parseInt(bpmInput.value, 10) || 120);
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      volumeLabel.textContent = val + '%';
      metronome.setVolume(val / 100);
    });

    function renderIndicators() {
      indicatorsContainer.innerHTML = '';
      const totalSteps = metronome.beatsPerBar * metronome.subdivision;

      for (let i = 0; i < totalSteps; i++) {
        const col = document.createElement('div');
        col.className = 'beat-col';

        const dot = document.createElement('div');
        dot.className = 'beat-dot';
        if (i % metronome.subdivision !== 0) {
          dot.classList.add('sub');
        }

        const arrow = document.createElement('div');
        arrow.className = 'strum-arrow';

        // Pengetés iránya és osztályozása: az 1. hang (i=0) kötelezően lefelé (piros)
        const isDown = (metronome.strumPattern === 'down') || (i % 2 === 0);

        if (isDown) {
          col.classList.add('strum-down');
          arrow.textContent = '↓';
        } else {
          col.classList.add('strum-up');
          arrow.textContent = '↑';
        }

        col.appendChild(dot);
        col.appendChild(arrow);
        indicatorsContainer.appendChild(col);
      }
    }

    document.querySelectorAll('#beatsContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#beatsContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.beatsPerBar = parseInt(btn.dataset.beats, 10);
        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#subdivContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#subdivContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.subdivision = parseInt(btn.dataset.sub, 10);
        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#strumContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#strumContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.strumPattern = btn.dataset.strum;
        renderIndicators();
      });
    });

    playBtn.addEventListener('click', () => {
      if (!metronome.isPlaying) {
        metronome.start();
        playBtn.textContent = 'Leállítás';
        playBtn.classList.add('playing');
      } else {
        metronome.stop();
        playBtn.textContent = 'Indítás';
        playBtn.classList.remove('playing');
        clearHighlights();
      }
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) {
        tapTimes = [];
      }
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const calculatedBpm = Math.round(60000 / avgInterval);
        updateBpm(calculatedBpm);
      }
    });

    function clearHighlights() {
      document.querySelectorAll('.beat-col').forEach(col => {
        col.classList.remove('active');
      });
    }

    metronome.onTick = (step) => {
      const cols = indicatorsContainer.children;
      clearHighlights();
      if (cols[step]) {
        cols[step].classList.add('active');
      }
    };

    function renderLoop() {
      metronome.updateVisuals();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    renderIndicators();
  </script>
</body>
</html>
