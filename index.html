<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PolyBeat - Web Audio Metronome</title>
  <style>
    /* ========================================================
       CSS VARIABLES & THEMES (BLACK / WHITE / SYSTEM)
       ======================================================== */
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --panel-bg: #11151c;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-strong: #1f6feb;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --sub-text: #8b949e;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --card-shadow: rgba(0, 0, 0, 0.5);

      --beat-dot-color: #ffffff;

      --strum-down: #ff3b56;
      --strum-down-dim: rgba(255, 59, 86, 0.4);
      --strum-up: #00d2ee;
      --strum-up-dim: rgba(0, 210, 238, 0.4);

      --mode-active-bg: #3b2361;
      --mode-active-border: #d2a8ff;
      --mode-active-text: #f0f6fc;
      --gold: #f1e05a;
      --accuracy-perfect: #2ea043;
      --accuracy-early: #f1e05a;
      --accuracy-late: #ff7b72;
    }

    [data-theme="light"] {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --panel-bg: #f6f8fa;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-strong: #0969da;
      --text: #24292f;
      --text-bright: #0969da;
      --sub-text: #57606a;
      --btn-bg: #f3f4f6;
      --btn-hover: #e5e7eb;
      --card-shadow: rgba(0, 0, 0, 0.08);

      --beat-dot-color: #24292f;

      --strum-down: #cf222e;
      --strum-down-dim: rgba(207, 34, 46, 0.35);
      --strum-up: #0969da;
      --strum-up-dim: rgba(9, 105, 218, 0.35);

      --mode-active-bg: #f2eaff;
      --mode-active-border: #8250df;
      --mode-active-text: #8250df;
      --gold: #9a6700;
      --accuracy-perfect: #1a7f37;
      --accuracy-early: #9a6700;
      --accuracy-late: #cf222e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 0.6rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .theme-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.45rem 0.75rem;
      box-shadow: 0 4px 12px var(--card-shadow);
    }

    .theme-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub-text);
    }

    .theme-buttons {
      display: flex;
      gap: 0.3rem;
    }

    .theme-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    .theme-btn.active {
      background: var(--accent-strong);
      border-color: var(--accent);
      color: #ffffff;
    }

    #errorBanner {
      display: none;
      background: #da3633;
      color: #fff;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      word-break: break-all;
    }

    .metronome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1rem;
      box-shadow: 0 16px 36px var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .tempo-display { text-align: center; }

    .bpm-input-wrapper {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .bpm-input {
      font-size: 3.8rem;
      font-weight: 800;
      color: var(--text-bright);
      background: transparent;
      border: 1px dashed transparent;
      border-radius: 8px;
      text-align: center;
      width: 155px;
      padding: 0;
      outline: none;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .bpm-input::-webkit-outer-spin-button,
    .bpm-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .bpm-input[type=number] { -moz-appearance: textfield; }

    .bpm-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub-text);
      margin-top: 0.2rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .step-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Helytakarékos Hangerő sor */
    .vol-compact-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.35rem 0.65rem;
    }

    .vol-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--sub-text);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .vol-label span {
      color: var(--text-bright);
      font-variant-numeric: tabular-nums;
    }

    .vol-compact-row input[type=range] {
      flex: 1;
      height: 4px;
    }

    .silent-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .silent-btn.active {
      background: #da3633;
      border-color: #f85149;
      color: #fff;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub-text);
    }

    .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
    .button-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; }
    .button-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }

    .time-sig-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
    }

    .time-sig-btn {
      padding: 0.5rem 0.1rem;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .toggle-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--accent-strong);
      border-color: var(--accent);
      color: #ffffff;
    }

    .collapsible-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .collapse-header-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.65rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .collapse-chevron {
      transition: transform 0.2s ease;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .collapsible-card.open .collapse-chevron {
      transform: rotate(180deg);
    }

    .collapse-content {
      display: none;
      padding: 0.25rem 0.75rem 0.75rem;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .collapsible-card.open .collapse-content {
      display: flex;
    }

    .practice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.12rem;
      padding: 0.5rem 0.2rem;
    }
    .practice-btn .sub-label { font-size: 0.62rem; opacity: 0.75; }
    .practice-btn.active {
      background: var(--mode-active-bg);
      border-color: var(--mode-active-border);
      color: var(--mode-active-text);
    }

    .ladder-panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .ladder-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.4rem;
      width: 100%;
    }

    .ladder-field {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .ladder-field label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--sub-text);
    }

    .ladder-field input {
      width: 100%;
      box-sizing: border-box;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.3rem 0.15rem;
      font-size: 0.8rem;
      text-align: center;
      outline: none;
    }

    /* ========================================================
       KIEGYENSÚLYOZOTT, JÓL LÁTHATÓ RITMUSJELZŐ SÁV
       ======================================================== */
    .beat-indicators {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      min-height: 68px;
      background: var(--bg);
      padding: 0.65rem 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      width: 100%;
    }

    .beat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    /* Fő ütések: 13 px jól látható korongok */
    .beat-dot.main-beat {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--beat-dot-color);
      border: 2px solid var(--beat-dot-color);
      transition: all 0.08s;
    }

    /* Szubdivíziók: 9 px tiszta körök */
    .beat-dot.sub {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid var(--beat-dot-color);
      opacity: 0.7;
      transition: all 0.08s;
    }

    .strum-arrow {
      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1;
      user-select: none;
      transition: all 0.08s;
    }

    .strum-down .strum-arrow { color: var(--strum-down-dim); }
    .strum-up .strum-arrow { color: var(--strum-up-dim); }

    .beat-col.active { transform: scale(1.15); }
    .beat-col.active.strum-down .beat-dot {
      background: var(--strum-down) !important;
      border-color: var(--strum-down) !important;
      box-shadow: 0 0 12px var(--strum-down);
    }
    .beat-col.active.strum-down .strum-arrow {
      color: var(--strum-down);
      filter: drop-shadow(0 0 8px var(--strum-down));
    }

    .beat-col.active.strum-up .beat-dot {
      background: var(--strum-up) !important;
      border-color: var(--strum-up) !important;
      box-shadow: 0 0 12px var(--strum-up);
    }
    .beat-col.active.strum-up .strum-arrow {
      color: var(--strum-up);
      filter: drop-shadow(0 0 8px var(--strum-up));
    }

    .training-wheels-off .beat-col.is-subdivision { opacity: 0.12; }
    .training-wheels-off .beat-col.is-subdivision .strum-arrow { visibility: hidden; }

    /* Enyhe, kényelmes igazítás ha sok a tizenhatod (12+ elem), hogy kényelmesen elférjen */
    .beat-indicators.compact-view {
      gap: 3.5px;
      padding: 0.65rem 0.35rem;
    }
    .beat-indicators.compact-view .beat-col {
      gap: 0.28rem;
    }
    .beat-indicators.compact-view .beat-dot.main-beat {
      width: 11px;
      height: 11px;
      border-width: 2px;
    }
    .beat-indicators.compact-view .beat-dot.sub {
      width: 8px;
      height: 8px;
      border-width: 1.8px;
    }
    .beat-indicators.compact-view .strum-arrow {
      font-size: 0.95rem;
    }

    .action-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.65rem;
      margin-top: 0.1rem;
    }

    .primary-btn {
      background: #238636;
      border: none;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .primary-btn.playing { background: #da3633; }

    .tap-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Standalone Gitár egység */
    .guitar-standalone-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.15rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: 0 12px 28px var(--card-shadow);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .guitar-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .guitar-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .beta-badge {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      background: rgba(241, 224, 90, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .accuracy-badge {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--sub-text);
      letter-spacing: 0.05em;
    }
    .accuracy-badge.perfect { background: rgba(46, 160, 67, 0.25); color: var(--accuracy-perfect); border: 1px solid var(--accuracy-perfect); }
    .accuracy-badge.early { background: rgba(241, 224, 90, 0.25); color: var(--accuracy-early); border: 1px solid var(--accuracy-early); }
    .accuracy-badge.late { background: rgba(255, 123, 114, 0.25); color: var(--accuracy-late); border: 1px solid var(--accuracy-late); }

    .guitar-controls-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .mic-main-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .mic-main-btn.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }

    .meter-container { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
    .meter-label-row { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--sub-text); text-transform: uppercase; }
    .level-meter-wrapper { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .level-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent) 0%, var(--strum-up) 80%, var(--strum-down) 100%); transition: width 0.04s linear; }

    .calib-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      background: var(--panel-bg);
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .calib-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .calib-item-header { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--sub-text); text-transform: uppercase; }

    .guitar-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--sub-text);
    }
    .guitar-stats-row .highlight { color: var(--text-bright); }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="errorBanner"></div>

    <!-- Theme Switcher -->
    <header class="theme-bar">
      <span class="theme-label">Theme</span>
      <div class="theme-buttons" id="themeButtons">
        <button class="theme-btn active" data-theme-val="system">System</button>
        <button class="theme-btn" data-theme-val="light">White</button>
        <button class="theme-btn" data-theme-val="dark">Black</button>
      </div>
    </header>

    <!-- Main Metronome Unit -->
    <main class="metronome-card">
      <div class="tempo-display">
        <div class="bpm-input-wrapper">
          <input type="number" id="bpmInput" class="bpm-input" min="1" max="240" value="120" title="Click to edit, press Enter">
        </div>
        <div class="bpm-label" id="bpmSubText">BPM (1 – 240) • Press Enter</div>
      </div>

      <div class="slider-row">
        <button class="step-btn" id="bpmMinus">−</button>
        <input type="range" id="bpmSlider" min="1" max="240" value="120">
        <button class="step-btn" id="bpmPlus">+</button>
      </div>

      <!-- Compact 1-row Volume & Mute -->
      <div class="vol-compact-row">
        <span class="vol-label">VOL <span id="volumeLabel">80%</span></span>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <button class="silent-btn" id="silentToggleBtn">🔇 MUTE</button>
      </div>

      <!-- Time Signatures -->
      <div class="control-group">
        <div class="group-header"><span>Time Signature</span></div>
        <div class="time-sig-grid" id="beatsContainer">
          <button class="toggle-btn time-sig-btn" data-beats="2">2/4</button>
          <button class="toggle-btn time-sig-btn" data-beats="3">3/4</button>
          <button class="toggle-btn time-sig-btn active" data-beats="4">4/4</button>
          <button class="toggle-btn time-sig-btn" data-beats="6">6/8</button>
          <button class="toggle-btn time-sig-btn" data-beats="7">7/8</button>
          <button class="toggle-btn time-sig-btn" data-beats="none" title="No Accent on Beat 1">None</button>
        </div>
      </div>

      <!-- Subdivision -->
      <div class="control-group">
        <div class="group-header"><span>Subdivision</span></div>
        <div class="button-grid" id="subdivContainer">
          <button class="toggle-btn active" data-sub="1">Quarter</button>
          <button class="toggle-btn" data-sub="2">8th</button>
          <button class="toggle-btn" data-sub="3">Triplet</button>
          <button class="toggle-btn" data-sub="4">16th</button>
        </div>
      </div>

      <!-- Collapsible Practice Panel -->
      <div class="collapsible-card" id="practiceCollapsible">
        <button type="button" class="collapse-header-btn" id="collapseToggleBtn">
          <span>🛠️ Practice & Training Tools</span>
          <span class="collapse-chevron">▼</span>
        </button>
        <div class="collapse-content">
          <div class="control-group">
            <div class="group-header"><span>Strumming Direction</span></div>
            <div class="button-grid-2" id="strumContainer">
              <button class="toggle-btn active" data-strum="alternate">
                Alternate (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-up)">↑</span>)
              </button>
              <button class="toggle-btn" data-strum="down">
                Down only (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-down)">↓</span>)
              </button>
            </div>
          </div>

          <div class="control-group">
            <div class="group-header">
              <span>Practice Modes</span>
              <span id="trainerStatus" style="color: var(--mode-active-text); font-weight: 600;"></span>
            </div>
            <div class="button-grid-3">
              <button class="toggle-btn practice-btn" id="btnTrainingWheels">
                <span>Training Wheels</span>
                <span class="sub-label">30s then solo</span>
              </button>
              <button class="toggle-btn practice-btn" id="btnGapClick">
                <span>Gap Click</span>
                <span class="sub-label">3 bars : 1 mute</span>
              </button>
              <button class="toggle-btn practice-btn" id="btnRandomDrop">
                <span>Random Drop</span>
                <span class="sub-label">Ghost beat</span>
              </button>
            </div>
          </div>

          <div class="ladder-panel">
            <div class="group-header">
              <span>Auto BPM Ladder & Pyramid</span>
              <span id="ladderStatusText" style="color: var(--gold); font-weight: 600;"></span>
            </div>
            <div class="ladder-row">
              <div class="ladder-field">
                <label>Start</label>

  <script>
    window.onerror = function(msg, url, line) {
      const banner = document.getElementById('errorBanner');
      if (banner) {

    };

    // Theme Management
    const themeButtons = document.querySelectorAll('#themeButtons .theme-btn');
    let currentThemeMode = localStorage.getItem('polybeat_theme') || 'system';

    function applyTheme(mode) {
      currentThemeMode = mode;
      localStorage.setItem('polybeat_theme', mode);

      themeButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeVal === mode);
      });

      if (mode === 'system') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', mode);
      }
    }

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.themeVal));
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentThemeMode === 'system') applyTheme('system');
    });

    applyTheme(currentThemeMode);

    // Screen Wake Lock
    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }

    async function releaseWakeLock() {
      if (wakeLockSentinel) {
        try { await wakeLockSentinel.release(); } catch (err) {}
        wakeLockSentinel = null;
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && metronome.isPlaying) {
        await acquireWakeLock();
      }
    });

    // Metronome Engine
    class MetronomeEngine {
      constructor() {
        this.audioCtx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.bpm = 120;
        this.beatsPerBar = 4;
        this.noEmphasis = false;
        this.subdivision = 1;
        this.strumPattern = 'alternate';
        this.volume = 0.8;
        this.isSilent = false;

        this.trainingWheels = false;
        this.gapClick = false;
        this.randomDrop = false;

        this.ladderEnabled = false;
        this.pyramidEnabled = false;
        this.ladderStart = 80;
        this.ladderTarget = 130;
        this.ladderStep = 5;
        this.ladderBarsInterval = 4;
        this.ladderDirection = 1;
        this.ladderBarCounter = 0;

        this.timerMinutes = 0;
        this.timerRemainingMs = 0;
        this.lastTimerTick = 0;

        this.scheduleAheadTime = 0.12;
        this.nextNoteTime = 0.0;
        this.currentStep = 0;
        this.totalBarsElapsed = 0;
        this.playbackStartTime = 0.0;

        this.bufferFirst = null;
        this.bufferBeat = null;
        this.bufferSub = null;
        this.bufferChime = null;

        this.notesInQueue = [];
        this.scheduledBeatsHistory = [];

        this.onTick = null;
        this.onBpmAutoChange = null;
        this.onTimerUpdate = null;
        this.onSessionComplete = null;

        this.initWorker();
      }

      initWorker() {
        try {
          const workerCode = `
            let timer = null;
            self.onmessage = function(e) {
              if (e.data === 'start') {
                if (!timer) timer = setInterval(() => self.postMessage('tick'), 25);
              } else if (e.data === 'stop') {
                if (timer) { clearInterval(timer); timer = null; }
              }
            };
          `;
          const blob = new Blob([workerCode], { type: 'application/javascript' });
          this.timerWorker = new Worker(URL.createObjectURL(blob));
          this.timerWorker.onmessage = (e) => {
            if (e.data === 'tick') {
              this.scheduler();
              this.checkSessionTimer();
            }
          };
        } catch (err) {
          this.fallbackTimer = null;
          this.timerWorker = {
            postMessage: (msg) => {
              if (msg === 'start') {
                if (!this.fallbackTimer) {
                  this.fallbackTimer = setInterval(() => {
                    this.scheduler();
                    this.checkSessionTimer();
                  }, 25);
                }
              } else if (msg === 'stop') {
                if (this.fallbackTimer) {
                  clearInterval(this.fallbackTimer);
                  this.fallbackTimer = null;
                }
              }
            }
          };
        }
      }

      createClickBuffer(freqStart, freqEnd, duration, decayRate, gainFactor = 1.0) {
        const sampleRate = this.audioCtx.sampleRate;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = this.audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);
        let phase = 0;

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t * decayRate);
          const currentFreq = freqEnd + (freqStart - freqEnd) * Math.exp(-t * 90);
          phase += (2 * Math.PI * currentFreq) / sampleRate;
          const noise = (Math.random() * 2 - 1) * Math.exp(-t * 150);
          data[i] = (Math.sin(phase) * 0.85 + noise * 0.15) * env * gainFactor;
        }
        return buffer;
      }

      createChimeBuffer() {
        const sampleRate = this.audioCtx.sampleRate;
        const duration = 1.0;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = this.audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t * 4.0);
          data[i] = (Math.sin(2 * Math.PI * 1046.5 * t) * 0.5 + Math.sin(2 * Math.PI * 1318.5 * t) * 0.5) * env * 0.7;
        }
        return buffer;
      }

      initAudio() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContextClass();

          this.masterGain = this.audioCtx.createGain();
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
          this.masterGain.connect(this.audioCtx.destination);

          this.bufferFirst = this.createClickBuffer(1700, 800, 0.045, 95, 1.0);
          this.bufferBeat  = this.createClickBuffer(1200, 550, 0.035, 110, 0.75);
          this.bufferSub   = this.createClickBuffer(800, 400, 0.025, 140, 0.4);
          this.bufferChime = this.createChimeBuffer();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.masterGain && this.audioCtx) {
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
        }
      }

      setBpm(newBpm) {
        const clamped = Math.max(1, Math.min(240, Math.round(newBpm)));
        if (clamped === this.bpm) return;

        if (this.isPlaying && this.audioCtx) {
          const now = this.audioCtx.currentTime;
          const remaining = this.nextNoteTime - now;
          if (remaining > 0) {
            this.nextNoteTime = now + remaining * (this.bpm / clamped);
          }
        }
        this.bpm = clamped;
      }

      checkSessionTimer() {
        if (!this.isPlaying || this.timerMinutes === 0) return;
        const now = performance.now();
        const delta = now - this.lastTimerTick;
        this.lastTimerTick = now;

        this.timerRemainingMs -= delta;
        if (this.onTimerUpdate) this.onTimerUpdate(Math.max(0, this.timerRemainingMs));

        if (this.timerRemainingMs <= 0) {
          this.stop();
          if (this.audioCtx && this.bufferChime) {
            const chimeSource = this.audioCtx.createBufferSource();
            chimeSource.buffer = this.bufferChime;
            chimeSource.connect(this.masterGain);
            chimeSource.start();
          }
          if (this.onSessionComplete) this.onSessionComplete();
        }
      }

      handleLadderStep() {
        if (!this.ladderEnabled) return;
        this.ladderBarCounter++;

        if (this.ladderBarCounter >= this.ladderBarsInterval) {
          this.ladderBarCounter = 0;
          let nextBpm = this.bpm + (this.ladderDirection * this.ladderStep);

          if (this.ladderDirection > 0) {
            if (nextBpm >= this.ladderTarget) {
              nextBpm = this.ladderTarget;
              if (this.pyramidEnabled) this.ladderDirection = -1;
            }
          } else {
            if (nextBpm <= this.ladderStart) {
              nextBpm = this.ladderStart;
              this.ladderDirection = 1;
            }
          }

          if (nextBpm !== this.bpm) {
            this.setBpm(nextBpm);
            if (this.onBpmAutoChange) {
              this.onBpmAutoChange(nextBpm, this.ladderDirection);
            }
          }
        }
      }

      nextNote() {
        const secondsPerBeat = 60.0 / this.bpm;
        const secondsPerStep = secondsPerBeat / this.subdivision;

        this.nextNoteTime += secondsPerStep;
        this.currentStep++;

        const totalStepsInBar = this.beatsPerBar * this.subdivision;
        if (this.currentStep >= totalStepsInBar) {
          this.currentStep = 0;
          this.totalBarsElapsed++;
          this.handleLadderStep();
        }
      }

      scheduleNote(stepNumber, time) {
        const isBeat = (stepNumber % this.subdivision === 0);
        const isFirstBeat = !this.noEmphasis && (stepNumber === 0);
        const isSub = !isBeat;

        const elapsedSeconds = time - this.playbackStartTime;
        const wheelsAreOff = this.trainingWheels && (elapsedSeconds >= 30.0);
        const isGapMutedBar = this.gapClick && (this.totalBarsElapsed % 4 === 3);

        let isRandomDropped = false;
        if (this.randomDrop && !isFirstBeat) {
          isRandomDropped = (Math.random() < 0.18);
        }

        let shouldPlaySound = true;
        if (this.isSilent || isGapMutedBar || (wheelsAreOff && isSub) || isRandomDropped) {
          shouldPlaySound = false;
        }

        this.notesInQueue.push({
          step: stepNumber,
          time: time,
          muted: !shouldPlaySound && !this.isSilent,
          wheelsOff: wheelsAreOff
        });

        this.scheduledBeatsHistory.push({ time: time, step: stepNumber, evaluated: false });
        if (this.scheduledBeatsHistory.length > 36) this.scheduledBeatsHistory.shift();

        if (shouldPlaySound) {
          const source = this.audioCtx.createBufferSource();
          if (isFirstBeat) source.buffer = this.bufferFirst;
          else if (isBeat) source.buffer = this.bufferBeat;
          else source.buffer = this.bufferSub;

          source.connect(this.masterGain);
          source.start(time);
        }
      }

      scheduler() {
        if (!this.isPlaying) return;
        while (this.nextNoteTime < this.audioCtx.currentTime + this.scheduleAheadTime) {
          this.scheduleNote(this.currentStep, this.nextNoteTime);
          this.nextNote();
        }
      }

      start() {
        if (this.isPlaying) return;
        this.initAudio();
        this.isPlaying = true;
        this.currentStep = 0;
        this.totalBarsElapsed = 0;
        this.ladderBarCounter = 0;
        this.ladderDirection = 1;

        if (this.ladderEnabled) {
          this.setBpm(this.ladderStart);
          if (this.onBpmAutoChange) this.onBpmAutoChange(this.ladderStart, 1);
        }

        if (this.timerMinutes > 0) {
          this.timerRemainingMs = this.timerMinutes * 60 * 1000;
          this.lastTimerTick = performance.now();
        }

        this.playbackStartTime = this.audioCtx.currentTime + 0.05;
        this.nextNoteTime = this.playbackStartTime;
        this.notesInQueue = [];
        this.scheduledBeatsHistory = [];
        this.timerWorker.postMessage('start');
        acquireWakeLock();
      }

      stop() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        this.timerWorker.postMessage('stop');
        this.notesInQueue = [];
        releaseWakeLock();
      }

      updateVisuals() {
        if (!this.audioCtx) return;
        const currentTime = this.audioCtx.currentTime;

        while (this.notesInQueue.length > 0 && this.notesInQueue[0].time <= currentTime) {
          const currentNote = this.notesInQueue.shift();
          if (this.onTick) this.onTick(currentNote);
        }
      }
    }

    // Guitar Detector Engine
    class GuitarDetector {
      constructor(audioCtx, metronomeEngine) {
        this.audioCtx = audioCtx;
        this.metronome = metronomeEngine;
        this.stream = null;
        this.source = null;
        this.inputGain = null;
        this.hpFilter = null;
        this.lpFilter = null;
        this.analyser = null;
        this.isActive = false;

        this.dataArray = null;
        this.lastStrumTime = 0;
        this.debounceTime = 0.13;

        this.detectorState = 'ready';
        this.threshold = 0.018;
        this.latencyOffsetMs = -60;

        this.totalStrums = 0;
        this.perfectStrums = 0;
        this.onAccuracyResult = null;
        this.onLevelUpdate = null;
      }

      async start() {
        try {
          if (!this.audioCtx) this.metronome.initAudio();
          this.audioCtx = this.metronome.audioCtx;

          const audioConstraints = {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            latency: 0
          };

          this.stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
          this.source = this.audioCtx.createMediaStreamSource(this.stream);

          this.inputGain = this.audioCtx.createGain();
          this.inputGain.gain.setValueAtTime(2.5, this.audioCtx.currentTime);

          this.hpFilter = this.audioCtx.createBiquadFilter();
          this.hpFilter.type = 'highpass';
          this.hpFilter.frequency.setValueAtTime(65, this.audioCtx.currentTime);

          this.lpFilter = this.audioCtx.createBiquadFilter();
          this.lpFilter.type = 'lowpass';
          this.lpFilter.frequency.setValueAtTime(3000, this.audioCtx.currentTime);

          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 512;
          this.dataArray = new Float32Array(this.analyser.fftSize);

          this.source.connect(this.inputGain);
          this.inputGain.connect(this.hpFilter);
          this.hpFilter.connect(this.lpFilter);
          this.lpFilter.connect(this.analyser);

          this.isActive = true;
          this.totalStrums = 0;
          this.perfectStrums = 0;
          this.detectorState = 'ready';
          this.detectLoop();
          return true;
        } catch (err) {
          alert("Could not access microphone/audio input!");
          return false;
        }
      }

      stop() {
        this.isActive = false;
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
        }
        if (this.source) {
          this.source.disconnect();
          this.source = null;
        }
      }

      detectLoop() {
        if (!this.isActive) return;

        this.analyser.getFloatTimeDomainData(this.dataArray);

        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i] * this.dataArray[i];
        }
        const rms = Math.sqrt(sum / this.dataArray.length);

        if (this.onLevelUpdate) {
          this.onLevelUpdate(Math.min(1.0, rms * 14.0));
        }

        const now = this.audioCtx.currentTime;

        if (this.detectorState === 'ready') {
          if (rms >= this.threshold && (now - this.lastStrumTime) > this.debounceTime) {
            this.lastStrumTime = now;
            this.detectorState = 'holding';
            this.evaluateStrum(now);
          }
        } else if (this.detectorState === 'holding') {
          if ((now - this.lastStrumTime) > this.debounceTime && rms < (this.threshold * 0.65)) {
            this.detectorState = 'ready';
          }
        }

        requestAnimationFrame(() => this.detectLoop());
      }

      evaluateStrum(detectedTime) {
        if (!this.metronome.isPlaying || this.metronome.scheduledBeatsHistory.length === 0) return;

        const effectiveTime = detectedTime + (this.latencyOffsetMs / 1000.0);

        let closestBeat = null;
        let minDiffMs = Infinity;

        for (const beat of this.metronome.scheduledBeatsHistory) {
          const diffMs = (effectiveTime - beat.time) * 1000;
          if (Math.abs(diffMs) < Math.abs(minDiffMs)) {
            minDiffMs = diffMs;
            closestBeat = beat;
          }
        }

        if (closestBeat && Math.abs(minDiffMs) <= 240) {
          if (closestBeat.evaluated) return;
          closestBeat.evaluated = true;

          this.totalStrums++;
          let category = 'perfect';

          if (Math.abs(minDiffMs) <= 45) {
            category = 'perfect';
            this.perfectStrums++;
          } else if (minDiffMs < -45) {
            category = 'early';
          } else {
            category = 'late';
          }

          const scorePercent = Math.round((this.perfectStrums / this.totalStrums) * 100);

          if (this.onAccuracyResult) {
            this.onAccuracyResult({
              diffMs: Math.round(minDiffMs),
              category: category,
              scorePercent: scorePercent,
              totalStrums: this.totalStrums
            });
          }
        }
      }
    }

    function updateLadderSettings() {
      metronome.ladderStart = parseInt(ladderStartBpm.value, 10) || 80;
      metronome.ladderTarget = parseInt(ladderTargetBpm.value, 10) || 130;
      metronome.ladderStep = parseInt(ladderStep.value, 10) || 5;
    }

    btnLadderToggle.addEventListener('click', () => {
      metronome.ladderEnabled = !metronome.ladderEnabled;
      btnLadderToggle.classList.toggle('active', metronome.ladderEnabled);
      btnLadderToggle.textContent = metronome.ladderEnabled ? 'Ladder: ON' : 'Ladder: OFF';
      updateLadderSettings();
    });

    btnPyramidToggle.addEventListener('click', () => {
      metronome.pyramidEnabled = !metronome.pyramidEnabled;
      btnPyramidToggle.classList.toggle('active', metronome.pyramidEnabled);
      btnPyramidToggle.textContent = metronome.pyramidEnabled ? 'Pyramid: ON' : 'Pyramid: OFF';
    });

    [ladderStartBpm, ladderTargetBpm, ladderStep].forEach(el => {
      el.addEventListener('change', updateLadderSettings);
    });

    metronome.onBpmAutoChange = (newBpm, dir) => {
      bpmSlider.value = newBpm;
      bpmInput.value = newBpm;
      ladderStatusText.textContent = dir > 0 ? `▲ (${newBpm})` : `▼ (${newBpm})`;
    };

    micToggleBtn.addEventListener('click', async () => {
      if (!detector) {
        detector = new GuitarDetector(metronome.audioCtx, metronome);
        detector.latencyOffsetMs = parseInt(latencySlider.value, 10);
        applySensitivity(parseInt(sensitivitySlider.value, 10));

        detector.onLevelUpdate = (level) => {
          const pct = Math.round(level * 100);
          micLevelBar.style.width = pct + '%';
          levelValue.textContent = pct + '%';
        };

        detector.onAccuracyResult = (res) => {
          accuracyBadge.className = 'accuracy-badge ' + res.category;
          if (res.category === 'perfect') accuracyBadge.textContent = 'PERFECT';
          else if (res.category === 'early') accuracyBadge.textContent = 'EARLY!';
          else accuracyBadge.textContent = 'LATE!';

          const sign = res.diffMs > 0 ? '+' : '';
          offsetFeedback.textContent = `${sign}${res.diffMs} ms`;
          accuracyStats.textContent = `${res.scorePercent}% (${res.totalStrums} hits)`;
        };
      }

      if (!detector.isActive) {
        const ok = await detector.start();
        if (ok) {
          micToggleBtn.classList.add('active');
          micToggleBtn.textContent = '🎙️ Detector: ON';
          accuracyBadge.textContent = 'Listening...';
        }
      } else {
        detector.stop();
        micToggleBtn.classList.remove('active');
        micToggleBtn.textContent = '🎙️ Detector: OFF';
        accuracyBadge.className = 'accuracy-badge';
        accuracyBadge.textContent = 'Inactive';
        micLevelBar.style.width = '0%';
        levelValue.textContent = '0%';
      }
    });

    latencySlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      offsetLabel.textContent = (val > 0 ? '+' : '') + val + ' ms';
      if (detector) detector.latencyOffsetMs = val;
    });

    function applySensitivity(val) {
      let label = 'Medium';
      if (val < 35) label = 'Low';
      else if (val > 70) label = 'High';
      sensLabel.textContent = label;

      if (detector) {
        detector.threshold = 0.05 - ((val / 100) * 0.045);
      }
    }

    sensitivitySlider.addEventListener('input', (e) => {
      applySensitivity(parseInt(e.target.value, 10));
    });

    document.querySelectorAll('#timerPresetsContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#timerPresetsContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mins = parseInt(btn.dataset.time, 10);
        metronome.timerMinutes = mins;
        timerCountdown.textContent = mins === 0 ? 'Infinite' : `${mins}:00`;
      });
    });

    metronome.onTimerUpdate = (msRemaining) => {
      const totalSec = Math.ceil(msRemaining / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      timerCountdown.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    };

    metronome.onSessionComplete = () => {
      playBtn.textContent = 'Start';
      playBtn.classList.remove('playing');
      clearHighlights();
      timerCountdown.textContent = "Time's up!";
    };

    // Visszaállított, jól látható ritmusjelzők
    function renderIndicators() {
      indicatorsContainer.innerHTML = '';
      const totalSteps = metronome.beatsPerBar * metronome.subdivision;

      indicatorsContainer.classList.remove('compact-view');
      if (totalSteps > 8) {
        indicatorsContainer.classList.add('compact-view');
      }

      for (let i = 0; i < totalSteps; i++) {
        const col = document.createElement('div');
        col.className = 'beat-col';

        const isBeat = (i % metronome.subdivision === 0);
        const dot = document.createElement('div');

        if (isBeat) {
          dot.className = 'beat-dot main-beat';
        } else {
          dot.className = 'beat-dot sub';
          col.classList.add('is-subdivision');
        }

        const arrow = document.createElement('div');
        arrow.className = 'strum-arrow';

        const isDown = (metronome.strumPattern === 'down') || (i % 2 === 0);
        if (isDown) {
          col.classList.add('strum-down');
          arrow.textContent = '↓';
        } else {
          col.classList.add('strum-up');
          arrow.textContent = '↑';
        }

        col.appendChild(dot);
        col.appendChild(arrow);
        indicatorsContainer.appendChild(col);
      }
    }

    document.querySelectorAll('#beatsContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#beatsContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.beats === 'none') {
          metronome.noEmphasis = true;
          metronome.beatsPerBar = 4;
        } else {
          metronome.noEmphasis = false;
          metronome.beatsPerBar = parseInt(btn.dataset.beats, 10);
        }

        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#subdivContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#subdivContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.subdivision = parseInt(btn.dataset.sub, 10);
        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#strumContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#strumContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.strumPattern = btn.dataset.strum;
        renderIndicators();
      });
    });

    playBtn.addEventListener('click', () => {
      if (!metronome.isPlaying) {
        updateLadderSettings();
        metronome.start();
        playBtn.textContent = 'Stop';
        playBtn.classList.add('playing');
        trainerStatus.textContent = '';
      } else {
        metronome.stop();
        playBtn.textContent = 'Start';
        playBtn.classList.remove('playing');
        clearHighlights();
        indicatorsContainer.classList.remove('training-wheels-off');
        trainerStatus.textContent = '';
        ladderStatusText.textContent = '';
      }
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        updateBpm(Math.round(60000 / avgInterval));
      }
    });

    function clearHighlights() {
      document.querySelectorAll('.beat-col').forEach(col => col.classList.remove('active'));
    }

    metronome.onTick = (note) => {
      const cols = indicatorsContainer.children;
      clearHighlights();

      if (note.wheelsOff) {
        indicatorsContainer.classList.add('training-wheels-off');
        trainerStatus.textContent = 'Solo Mode!';
      } else {
        indicatorsContainer.classList.remove('training-wheels-off');
      }

      if (cols[note.step] && !note.muted) {
        cols[note.step].classList.add('active');
      }
    };

    function renderLoop() {
      metronome.updateVisuals();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    renderIndicators();
  </script>
</body>
</html>
