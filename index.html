<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PolyBeat - Web Audio Metronóm</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --panel-bg: #11151c;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-strong: #1f6feb;
      --text: #c9d1d9;
      --text-bright: #ffffff;

      --strum-down: #ff3b56;
      --strum-down-dim: rgba(255, 59, 86, 0.4);
      --strum-up: #00d2ee;
      --strum-up-dim: rgba(0, 210, 238, 0.4);

      --mode-active: #bc8cff;
      --mode-active-border: #d2a8ff;
      --gold: #f1e05a;
      --accuracy-perfect: #2ea043;
      --accuracy-early: #f1e05a;
      --accuracy-late: #ff7b72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    #errorBanner {
      display: none;
      background: #da3633;
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .metronome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .tempo-display { text-align: center; }

    .bpm-input-wrapper {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .bpm-input {
      font-size: 4.2rem;
      font-weight: 800;
      color: var(--text-bright);
      background: transparent;
      border: 1px dashed transparent;
      border-radius: 8px;
      text-align: center;
      width: 180px;
      padding: 0;
      outline: none;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .bpm-input::-webkit-outer-spin-button,
    .bpm-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .bpm-input[type=number] { -moz-appearance: textfield; }

    .bpm-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
      margin-top: 0.25rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .step-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
    }

    .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; }
    .button-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    .button-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }

    .toggle-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--accent-strong);
      border-color: var(--accent);
      color: var(--text-bright);
    }

    .practice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.55rem 0.2rem;
    }
    .practice-btn .sub-label { font-size: 0.65rem; opacity: 0.7; }
    .practice-btn.active {
      background: #3b2361;
      border-color: var(--mode-active-border);
      color: #f0f6fc;
    }

    .ladder-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow: hidden;
    }

    .ladder-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      width: 100%;
    }

    .ladder-field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .ladder-field label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: #8b949e;
    }

    .ladder-field input {
      width: 100%;
      box-sizing: border-box;
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 0.35rem 0.2rem;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    .vol-silent-row { display: flex; align-items: center; gap: 0.75rem; }
    .silent-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .silent-btn.active { background: #da3633; border-color: #f85149; color: #fff; }

    .beat-indicators {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      min-height: 72px;
      align-items: center;
      background: #0d1117;
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    .beat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    .beat-dot.main-beat {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #ffffff;
    }

    .beat-dot.sub {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.75);
    }

    .strum-arrow {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      user-select: none;
    }

    .strum-down .strum-arrow { color: var(--strum-down-dim); }
    .strum-up .strum-arrow { color: var(--strum-up-dim); }

    .beat-col.active { transform: scale(1.15); }
    .beat-col.active.strum-down .beat-dot {
      background: var(--strum-down) !important;
      border-color: var(--strum-down) !important;
      box-shadow: 0 0 14px var(--strum-down);
    }
    .beat-col.active.strum-down .strum-arrow {
      color: var(--strum-down);
      filter: drop-shadow(0 0 8px var(--strum-down));
    }

    .beat-col.active.strum-up .beat-dot {
      background: var(--strum-up) !important;
      border-color: var(--strum-up) !important;
      box-shadow: 0 0 14px var(--strum-up);
    }
    .beat-col.active.strum-up .strum-arrow {
      color: var(--strum-up);
      filter: drop-shadow(0 0 8px var(--strum-up));
    }

    .training-wheels-off .beat-col.is-subdivision { opacity: 0.12; }
    .training-wheels-off .beat-col.is-subdivision .strum-arrow { visibility: hidden; }

    .action-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
      margin-top: 0.1rem;
    }

    .primary-btn {
      background: #238636;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .primary-btn.playing { background: #da3633; }

    .tap-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Alsó gitáros blokk (BETA) */
    .guitar-bottom-card {
      margin-top: 0.5rem;
      background: linear-gradient(180deg, #131b26 0%, #0d131a 100%);
      border: 1px solid #1f3b5c;
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .guitar-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .guitar-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .beta-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: rgba(241, 224, 90, 0.15);
      color: var(--gold);
      border: 1px solid rgba(241, 224, 90, 0.4);
    }

    .accuracy-badge {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      background: #21262d;
      color: #8b949e;
    }
    .accuracy-badge.perfect { background: rgba(46, 160, 67, 0.25); color: var(--accuracy-perfect); border: 1px solid var(--accuracy-perfect); }
    .accuracy-badge.early { background: rgba(241, 224, 90, 0.25); color: var(--accuracy-early); border: 1px solid var(--accuracy-early); }
    .accuracy-badge.late { background: rgba(255, 123, 114, 0.25); color: var(--accuracy-late); border: 1px solid var(--accuracy-late); }

    .guitar-controls-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mic-main-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: var(--text-bright);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .mic-main-btn.active { background: #1f6feb; border-color: #58a6ff; }

    .meter-container { flex: 1; display: flex; flex-direction: column; gap: 0.25rem; }
    .meter-label-row { display: flex; justify-content: space-between; font-size: 0.68rem; color: #8b949e; text-transform: uppercase; }
    .level-meter-wrapper { height: 9px; background: #0d1117; border-radius: 5px; overflow: hidden; border: 1px solid #30363d; }
    .level-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #58a6ff 0%, #00d2ee 80%, #ff3b56 100%); transition: width 0.04s linear; }

    .calib-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .calib-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .calib-item-header { display: flex; justify-content: space-between; font-size: 0.68rem; color: #8b949e; text-transform: uppercase; }

    .guitar-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #8b949e;
    }
    .guitar-stats-row .highlight { color: #ffffff; }
  </style>
</head>
<body>

  <main class="metronome-card">
    <div id="errorBanner"></div>

    <div class="tempo-display">
      <div class="bpm-input-wrapper">
        <input type="number" id="bpmInput" class="bpm-input" min="1" max="240" value="120">
      </div>
      <div class="bpm-label" id="bpmSubText">BPM (1 – 240) • Nyomj Enter-t</div>
    </div>

    <div class="slider-row">
      <button class="step-btn" id="bpmMinus">−</button>
      <input type="range" id="bpmSlider" min="1" max="240" value="120">
      <button class="step-btn" id="bpmPlus">+</button>
    </div>

    <!-- Hangerő & Néma mód -->
    <div class="control-group">
      <div class="group-header">
        <span>Hangerő</span>
        <span id="volumeLabel">80%</span>
      </div>
      <div class="vol-silent-row">
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <button class="silent-btn" id="silentToggleBtn">🔇 Néma: KI</button>
      </div>
    </div>

    <!-- Ütemmutató -->
    <div class="control-group">
      <div class="group-header"><span>Ütemmutató</span></div>
      <div class="button-grid" id="beatsContainer">
        <button class="toggle-btn" data-beats="2">2/4</button>
        <button class="toggle-btn" data-beats="3">3/4</button>
        <button class="toggle-btn active" data-beats="4">4/4</button>
        <button class="toggle-btn" data-beats="6">6/8</button>
      </div>
    </div>

    <!-- Szubdivízió -->
    <div class="control-group">
      <div class="group-header"><span>Ritmikai felosztás</span></div>
      <div class="button-grid" id="subdivContainer">
        <button class="toggle-btn active" data-sub="1">Negyed</button>
        <button class="toggle-btn" data-sub="2">Nyolcad</button>
        <button class="toggle-btn" data-sub="3">Triola</button>
        <button class="toggle-btn" data-sub="4">Tizenhatod</button>
      </div>
    </div>

    <!-- Pengetés iránya -->
    <div class="control-group">
      <div class="group-header"><span>Pengetés iránya</span></div>
      <div class="button-grid-2" id="strumContainer">
        <button class="toggle-btn active" data-strum="alternate">
          Váltott (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-up)">↑</span>)
        </button>
        <button class="toggle-btn" data-strum="down">
          Csak le (<span style="color:var(--strum-down)">↓</span> <span style="color:var(--strum-down)">↓</span>)
        </button>
      </div>
    </div>

    <!-- Gyakorló edzőfunkciók -->
    <div class="control-group">
      <div class="group-header">
        <span>Gyakorló funkciók</span>
        <span id="trainerStatus" style="color: var(--mode-active); font-weight: 600;"></span>
      </div>
      <div class="button-grid-3">
        <button class="toggle-btn practice-btn" id="btnTrainingWheels">
          <span>Training Wheel</span>
          <span class="sub-label">30 mp önálló</span>
        </button>
        <button class="toggle-btn practice-btn" id="btnGapClick">
          <span>Gap Click</span>
          <span class="sub-label">3:1 csend</span>
        </button>
        <button class="toggle-btn practice-btn" id="btnRandomDrop">
          <span>Random Drop</span>
          <span class="sub-label">Kihagyás</span>
        </button>
      </div>
    </div>

    <!-- Auto BPM Létra & Piramis -->
    <div class="ladder-panel">
      <div class="group-header">
        <span>Auto BPM Létra</span>
        <span id="ladderStatusText" style="color: var(--gold); font-weight: 600;"></span>
      </div>
      <div class="ladder-row">
        <div class="ladder-field">
          <label>Start</label>
          <input type="number" id="ladderStartBpm" value="80">
        </div>
        <div class="ladder-field">
          <label>Cél</label>
          <input type="number" id="ladderTargetBpm" value="130">
        </div>
        <div class="ladder-field">
          <label>Lépés</label>
          <input type="number" id="ladderStep" value="5">
        </div>
      </div>
      <div class="slider-row" style="margin-top: 0.2rem;">
        <button class="toggle-btn" id="btnLadderToggle" style="flex:1;">Létra: KI</button>
        <button class="toggle-btn" id="btnPyramidToggle" style="flex:1;">Piramis: KI</button>
      </div>
    </div>

    <!-- Session Timer -->
    <div class="control-group">
      <div class="group-header">
        <span>Session Timer</span>
        <span id="timerCountdown" style="color: var(--gold); font-weight: 700;">Végtelen</span>
      </div>
      <div class="button-grid" id="timerPresetsContainer">
        <button class="toggle-btn active" data-time="0">KI</button>
        <button class="toggle-btn" data-time="5">5 perc</button>
        <button class="toggle-btn" data-time="10">10 perc</button>
        <button class="toggle-btn" data-time="15">15 perc</button>
      </div>
    </div>

    <!-- Vizuális visszajelző sáv -->
    <div class="beat-indicators" id="indicators"></div>

    <div class="action-row">
      <button class="primary-btn" id="playBtn">Indítás</button>
      <button class="tap-btn" id="tapBtn">TAP</button>
    </div>

    <!-- Alsó gitáros blokk (BETA) -->
    <section class="guitar-bottom-card">
      <div class="guitar-header-row">
        <div class="guitar-title">
          <span>🎸 Gitár Ritmus-pontosságmérő</span>
          <span class="beta-badge">BETA</span>
        </div>
        <div class="accuracy-badge" id="accuracyBadge">Inaktív</div>
      </div>

      <div class="guitar-controls-row">
        <button class="mic-main-btn" id="micToggleBtn">🎙️ Érzékelő: KI</button>
        <div class="meter-container">
          <div class="meter-label-row">
            <span>Bemeneti szint</span>
            <span id="levelValue">0%</span>
          </div>
          <div class="level-meter-wrapper">
            <div class="level-bar" id="micLevelBar"></div>
          </div>
        </div>
      </div>

      <div class="calib-grid">
        <div class="calib-item">
          <div class="calib-item-header">
            <span>Offset</span>
            <span id="offsetLabel" style="color: #58a6ff; font-weight:700;">−60 ms</span>
          </div>
          <input type="range" id="latencySlider" min="-150" max="100" value="-60" step="5">
        </div>
        <div class="calib-item">
          <div class="calib-item-header">
            <span>Érzékenység</span>
            <span id="sensLabel" style="color: #58a6ff; font-weight:700;">Közepes</span>
          </div>
          <input type="range" id="sensitivitySlider" min="1" max="100" value="50">
        </div>
      </div>

      <div class="guitar-stats-row">
        <span>Pontosság: <span class="highlight" id="accuracyStats">--% (0 találat)</span></span>
        <span>Eltérés: <span class="highlight" id="offsetFeedback">0 ms</span></span>
      </div>
    </section>
  </main>

  <script>
    window.onerror = function(msg, url, line) {
      const banner = document.getElementById('errorBanner');
      if (banner) {
        banner.style.display = 'block';
        banner.textContent = 'Hiba lépett fel: ' + msg + ' (Sor: ' + line + ')';
      }
      return false;
    };

    class MetronomeEngine {
      constructor() {
        this.audioCtx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.bpm = 120;
        this.beatsPerBar = 4;
        this.subdivision = 1;
        this.strumPattern = 'alternate';
        this.volume = 0.8;
        this.isSilent = false;

        this.trainingWheels = false;
        this.gapClick = false;
        this.randomDrop = false;

        this.ladderEnabled = false;
        this.pyramidEnabled = false;
        this.ladderStart = 80;
        this.ladderTarget = 130;
        this.ladderStep = 5;
        this.ladderBarsInterval = 4;
        this.ladderDirection = 1;
        this.ladderBarCounter = 0;

        this.timerMinutes = 0;
        this.timerRemainingMs = 0;
        this.lastTimerTick = 0;

        this.scheduleAheadTime = 0.12;
        this.nextNoteTime = 0.0;
        this.currentStep = 0;
        this.totalBarsElapsed = 0;
        this.playbackStartTime = 0.0;

        this.bufferFirst = null;
        this.bufferBeat = null;
        this.bufferSub = null;
        this.bufferChime = null;

        this.notesInQueue = [];
        this.scheduledBeatsHistory = [];

        this.onTick = null;
        this.onBpmAutoChange = null;
        this.onTimerUpdate = null;
        this.onSessionComplete = null;

        this.initWorker();
      }

      initWorker() {
        try {
          const workerCode = `
            let timer = null;
            self.onmessage = function(e) {
              if (e.data === 'start') {
                if (!timer) timer = setInterval(() => self.postMessage('tick'), 25);
              } else if (e.data === 'stop') {
                if (timer) { clearInterval(timer); timer = null; }
              }
            };
          `;
          const blob = new Blob([workerCode], { type: 'application/javascript' });
          this.timerWorker = new Worker(URL.createObjectURL(blob));
          this.timerWorker.onmessage = (e) => {
            if (e.data === 'tick') {
              this.scheduler();
              this.checkSessionTimer();
            }
          };
        } catch (err) {
          this.fallbackTimer = null;
          this.timerWorker = {
            postMessage: (msg) => {
              if (msg === 'start') {
                if (!this.fallbackTimer) {
                  this.fallbackTimer = setInterval(() => {
                    this.scheduler();
                    this.checkSessionTimer();
                  }, 25);
                }
              } else if (msg === 'stop') {
                if (this.fallbackTimer) {
                  clearInterval(this.fallbackTimer);
                  this.fallbackTimer = null;
                }
              }
            }
          };
        }
      }

      createClickBuffer(freqStart, freqEnd, duration, decayRate, gainFactor = 1.0) {
        const sampleRate = this.audioCtx.sampleRate;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = this.audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);
        let phase = 0;

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t * decayRate);
          const currentFreq = freqEnd + (freqStart - freqEnd) * Math.exp(-t * 90);
          phase += (2 * Math.PI * currentFreq) / sampleRate;
          const noise = (Math.random() * 2 - 1) * Math.exp(-t * 150);
          data[i] = (Math.sin(phase) * 0.85 + noise * 0.15) * env * gainFactor;
        }
        return buffer;
      }

      createChimeBuffer() {
        const sampleRate = this.audioCtx.sampleRate;
        const duration = 1.0;
        const frameCount = Math.floor(sampleRate * duration);
        const buffer = this.audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t * 4.0);
          data[i] = (Math.sin(2 * Math.PI * 1046.5 * t) * 0.5 + Math.sin(2 * Math.PI * 1318.5 * t) * 0.5) * env * 0.7;
        }
        return buffer;
      }

      initAudio() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContextClass();

          this.masterGain = this.audioCtx.createGain();
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
          this.masterGain.connect(this.audioCtx.destination);

          this.bufferFirst = this.createClickBuffer(1700, 800, 0.045, 95, 1.0);
          this.bufferBeat  = this.createClickBuffer(1200, 550, 0.035, 110, 0.75);
          this.bufferSub   = this.createClickBuffer(800, 400, 0.025, 140, 0.4);
          this.bufferChime = this.createChimeBuffer();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.masterGain && this.audioCtx) {
          this.masterGain.gain.setValueAtTime(this.volume, this.audioCtx.currentTime);
        }
      }

      setBpm(newBpm) {
        const clamped = Math.max(1, Math.min(240, Math.round(newBpm)));
        if (clamped === this.bpm) return;

        if (this.isPlaying && this.audioCtx) {
          const now = this.audioCtx.currentTime;
          const remaining = this.nextNoteTime - now;
          if (remaining > 0) {
            this.nextNoteTime = now + remaining * (this.bpm / clamped);
          }
        }
        this.bpm = clamped;
      }

      checkSessionTimer() {
        if (!this.isPlaying || this.timerMinutes === 0) return;
        const now = performance.now();
        const delta = now - this.lastTimerTick;
        this.lastTimerTick = now;

        this.timerRemainingMs -= delta;
        if (this.onTimerUpdate) this.onTimerUpdate(Math.max(0, this.timerRemainingMs));

        if (this.timerRemainingMs <= 0) {
          this.stop();
          if (this.audioCtx && this.bufferChime) {
            const chimeSource = this.audioCtx.createBufferSource();
            chimeSource.buffer = this.bufferChime;
            chimeSource.connect(this.masterGain);
            chimeSource.start();
          }
          if (this.onSessionComplete) this.onSessionComplete();
        }
      }

      handleLadderStep() {
        if (!this.ladderEnabled) return;
        this.ladderBarCounter++;

        if (this.ladderBarCounter >= this.ladderBarsInterval) {
          this.ladderBarCounter = 0;
          let nextBpm = this.bpm + (this.ladderDirection * this.ladderStep);

          if (this.ladderDirection > 0) {
            if (nextBpm >= this.ladderTarget) {
              nextBpm = this.ladderTarget;
              if (this.pyramidEnabled) this.ladderDirection = -1;
            }
          } else {
            if (nextBpm <= this.ladderStart) {
              nextBpm = this.ladderStart;
              this.ladderDirection = 1;
            }
          }

          if (nextBpm !== this.bpm) {
            this.setBpm(nextBpm);
            if (this.onBpmAutoChange) this.onBpmAutoChange(nextBpm, this.ladderDirection);
          }
        }
      }

      nextNote() {
        const secondsPerBeat = 60.0 / this.bpm;
        const secondsPerStep = secondsPerBeat / this.subdivision;

        this.nextNoteTime += secondsPerStep;
        this.currentStep++;

        const totalStepsInBar = this.beatsPerBar * this.subdivision;
        if (this.currentStep >= totalStepsInBar) {
          this.currentStep = 0;
          this.totalBarsElapsed++;
          this.handleLadderStep();
        }
      }

      scheduleNote(stepNumber, time) {
        const isBeat = (stepNumber % this.subdivision === 0);
        const isFirstBeat = (stepNumber === 0);
        const isSub = !isBeat;

        const elapsedSeconds = time - this.playbackStartTime;
        const wheelsAreOff = this.trainingWheels && (elapsedSeconds >= 30.0);
        const isGapMutedBar = this.gapClick && (this.totalBarsElapsed % 4 === 3);

        let isRandomDropped = false;
        if (this.randomDrop && !isFirstBeat) {
          isRandomDropped = (Math.random() < 0.18);
        }

        let shouldPlaySound = true;
        if (this.isSilent || isGapMutedBar || (wheelsAreOff && isSub) || isRandomDropped) {
          shouldPlaySound = false;
        }

        this.notesInQueue.push({
          step: stepNumber,
          time: time,
          muted: !shouldPlaySound && !this.isSilent,
          wheelsOff: wheelsAreOff
        });

        this.scheduledBeatsHistory.push({ time: time, step: stepNumber, evaluated: false });
        if (this.scheduledBeatsHistory.length > 36) this.scheduledBeatsHistory.shift();

        if (shouldPlaySound) {
          const source = this.audioCtx.createBufferSource();
          if (isFirstBeat) source.buffer = this.bufferFirst;
          else if (isBeat) source.buffer = this.bufferBeat;
          else source.buffer = this.bufferSub;

          source.connect(this.masterGain);
          source.start(time);
        }
      }

      scheduler() {
        if (!this.isPlaying) return;
        while (this.nextNoteTime < this.audioCtx.currentTime + this.scheduleAheadTime) {
          this.scheduleNote(this.currentStep, this.nextNoteTime);
          this.nextNote();
        }
      }

      start() {
        if (this.isPlaying) return;
        this.initAudio();
        this.isPlaying = true;
        this.currentStep = 0;
        this.totalBarsElapsed = 0;
        this.ladderBarCounter = 0;
        this.ladderDirection = 1;

        if (this.ladderEnabled) {
          this.setBpm(this.ladderStart);
          if (this.onBpmAutoChange) this.onBpmAutoChange(this.ladderStart, 1);
        }

        if (this.timerMinutes > 0) {
          this.timerRemainingMs = this.timerMinutes * 60 * 1000;
          this.lastTimerTick = performance.now();
        }

        this.playbackStartTime = this.audioCtx.currentTime + 0.05;
        this.nextNoteTime = this.playbackStartTime;
        this.notesInQueue = [];
        this.scheduledBeatsHistory = [];
        this.timerWorker.postMessage('start');
      }

      stop() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        this.timerWorker.postMessage('stop');
        this.notesInQueue = [];
      }

      updateVisuals() {
        if (!this.audioCtx) return;
        const currentTime = this.audioCtx.currentTime;

        while (this.notesInQueue.length > 0 && this.notesInQueue[0].time <= currentTime) {
          const currentNote = this.notesInQueue.shift();
          if (this.onTick) this.onTick(currentNote);
        }
      }
    }

    class GuitarDetector {
      constructor(audioCtx, metronomeEngine) {
        this.audioCtx = audioCtx;
        this.metronome = metronomeEngine;
        this.stream = null;
        this.source = null;
        this.hpFilter = null;
        this.lpFilter = null;
        this.analyser = null;
        this.isActive = false;

        this.dataArray = null;
        this.lastStrumTime = 0;
        this.debounceTime = 0.16;

        this.prevRms = 0;
        this.latencyOffsetMs = -60;
        this.threshold = 0.035;

        this.totalStrums = 0;
        this.perfectStrums = 0;
        this.onAccuracyResult = null;
        this.onLevelUpdate = null;
      }

      async start() {
        try {
          if (!this.audioCtx) this.metronome.initAudio();
          this.audioCtx = this.metronome.audioCtx;

          const audioConstraints = {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            latency: 0
          };

          this.stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
          this.source = this.audioCtx.createMediaStreamSource(this.stream);

          this.hpFilter = this.audioCtx.createBiquadFilter();
          this.hpFilter.type = 'highpass';
          this.hpFilter.frequency.setValueAtTime(70, this.audioCtx.currentTime);

          this.lpFilter = this.audioCtx.createBiquadFilter();
          this.lpFilter.type = 'lowpass';
          this.lpFilter.frequency.setValueAtTime(2200, this.audioCtx.currentTime);

          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 512;
          this.dataArray = new Float32Array(this.analyser.fftSize);

          this.source.connect(this.hpFilter);
          this.hpFilter.connect(this.lpFilter);
          this.lpFilter.connect(this.analyser);

          this.isActive = true;
          this.totalStrums = 0;
          this.perfectStrums = 0;
          this.prevRms = 0;
          this.detectLoop();
          return true;
        } catch (err) {
          alert("Nem sikerült elérni a hangbemenetet!");
          return false;
        }
      }

      stop() {
        this.isActive = false;
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
        }
        if (this.source) {
          this.source.disconnect();
          this.source = null;
        }
      }

      detectLoop() {
        if (!this.isActive) return;

        this.analyser.getFloatTimeDomainData(this.dataArray);

        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i] * this.dataArray[i];
        }
        const rms = Math.sqrt(sum / this.dataArray.length);

        if (this.onLevelUpdate) this.onLevelUpdate(Math.min(1.0, rms * 6.5));

        const now = this.audioCtx.currentTime;
        const delta = rms - this.prevRms;
        this.prevRms = rms * 0.7 + this.prevRms * 0.3;

        const isAttackOnset = (delta > this.threshold * 0.45) && (rms > this.threshold);

        if (isAttackOnset && (now - this.lastStrumTime) > this.debounceTime) {
          this.lastStrumTime = now;
          this.evaluateStrum(now);
        }

        requestAnimationFrame(() => this.detectLoop());
      }

      evaluateStrum(detectedTime) {
        if (!this.metronome.isPlaying || this.metronome.scheduledBeatsHistory.length === 0) return;

        const effectiveTime = detectedTime + (this.latencyOffsetMs / 1000.0);

        let closestBeat = null;
        let minDiffMs = Infinity;

        for (const beat of this.metronome.scheduledBeatsHistory) {
          const diffMs = (effectiveTime - beat.time) * 1000;
          if (Math.abs(diffMs) < Math.abs(minDiffMs)) {
            minDiffMs = diffMs;
            closestBeat = beat;
          }
        }

        if (closestBeat && Math.abs(minDiffMs) <= 190) {
          if (closestBeat.evaluated) return;
          closestBeat.evaluated = true;

          this.totalStrums++;
          let category = 'perfect';

          if (Math.abs(minDiffMs) <= 45) {
            category = 'perfect';
            this.perfectStrums++;
          } else if (minDiffMs < -45) {
            category = 'early';
          } else {
            category = 'late';
          }

          const scorePercent = Math.round((this.perfectStrums / this.totalStrums) * 100);

          if (this.onAccuracyResult) {
            this.onAccuracyResult({
              diffMs: Math.round(minDiffMs),
              category: category,
              scorePercent: scorePercent,
              totalStrums: this.totalStrums
            });
          }
        }
      }
    }

    const metronome = new MetronomeEngine();
    let detector = null;

    const bpmInput = document.getElementById('bpmInput');
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmMinus = document.getElementById('bpmMinus');
    const bpmPlus = document.getElementById('bpmPlus');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const silentToggleBtn = document.getElementById('silentToggleBtn');
    const playBtn = document.getElementById('playBtn');
    const tapBtn = document.getElementById('tapBtn');
    const indicatorsContainer = document.getElementById('indicators');
    const trainerStatus = document.getElementById('trainerStatus');
    const timerCountdown = document.getElementById('timerCountdown');

    const btnTrainingWheels = document.getElementById('btnTrainingWheels');
    const btnGapClick = document.getElementById('btnGapClick');
    const btnRandomDrop = document.getElementById('btnRandomDrop');

    const ladderStartBpm = document.getElementById('ladderStartBpm');
    const ladderTargetBpm = document.getElementById('ladderTargetBpm');
    const ladderStep = document.getElementById('ladderStep');
    const btnLadderToggle = document.getElementById('btnLadderToggle');
    const btnPyramidToggle = document.getElementById('btnPyramidToggle');
    const ladderStatusText = document.getElementById('ladderStatusText');

    const micToggleBtn = document.getElementById('micToggleBtn');
    const micLevelBar = document.getElementById('micLevelBar');
    const levelValue = document.getElementById('levelValue');
    const accuracyBadge = document.getElementById('accuracyBadge');
    const accuracyStats = document.getElementById('accuracyStats');
    const offsetFeedback = document.getElementById('offsetFeedback');
    const latencySlider = document.getElementById('latencySlider');
    const offsetLabel = document.getElementById('offsetLabel');
    const sensitivitySlider = document.getElementById('sensitivitySlider');
    const sensLabel = document.getElementById('sensLabel');

    function updateBpm(newBpm) {
      metronome.setBpm(newBpm);
      bpmSlider.value = metronome.bpm;
      bpmInput.value = metronome.bpm;
    }

    bpmSlider.addEventListener('input', (e) => updateBpm(parseInt(e.target.value, 10)));
    bpmMinus.addEventListener('click', () => updateBpm(metronome.bpm - 1));
    bpmPlus.addEventListener('click', () => updateBpm(metronome.bpm + 1));

    bpmInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        updateBpm(parseInt(bpmInput.value, 10) || 120);
        bpmInput.blur();
      }
    });
    bpmInput.addEventListener('blur', () => updateBpm(parseInt(bpmInput.value, 10) || 120));

    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      volumeLabel.textContent = val + '%';
      metronome.setVolume(val / 100);
    });

    silentToggleBtn.addEventListener('click', () => {
      metronome.isSilent = !metronome.isSilent;
      silentToggleBtn.classList.toggle('active', metronome.isSilent);
      silentToggleBtn.textContent = metronome.isSilent ? '🔊 Néma: BE' : '🔇 Néma: KI';
    });

    btnTrainingWheels.addEventListener('click', () => {
      metronome.trainingWheels = !metronome.trainingWheels;
      btnTrainingWheels.classList.toggle('active', metronome.trainingWheels);
    });

    btnGapClick.addEventListener('click', () => {
      metronome.gapClick = !metronome.gapClick;
      btnGapClick.classList.toggle('active', metronome.gapClick);
    });

    btnRandomDrop.addEventListener('click', () => {
      metronome.randomDrop = !metronome.randomDrop;
      btnRandomDrop.classList.toggle('active', metronome.randomDrop);
    });

    function updateLadderSettings() {
      metronome.ladderStart = parseInt(ladderStartBpm.value, 10) || 80;
      metronome.ladderTarget = parseInt(ladderTargetBpm.value, 10) || 130;
      metronome.ladderStep = parseInt(ladderStep.value, 10) || 5;
    }

    btnLadderToggle.addEventListener('click', () => {
      metronome.ladderEnabled = !metronome.ladderEnabled;
      btnLadderToggle.classList.toggle('active', metronome.ladderEnabled);
      btnLadderToggle.textContent = metronome.ladderEnabled ? 'Létra: BE' : 'Létra: KI';
      updateLadderSettings();
    });

    btnPyramidToggle.addEventListener('click', () => {
      metronome.pyramidEnabled = !metronome.pyramidEnabled;
      btnPyramidToggle.classList.toggle('active', metronome.pyramidEnabled);
      btnPyramidToggle.textContent = metronome.pyramidEnabled ? 'Piramis: BE' : 'Piramis: KI';
    });

    [ladderStartBpm, ladderTargetBpm, ladderStep].forEach(el => {
      el.addEventListener('change', updateLadderSettings);
    });

    metronome.onBpmAutoChange = (newBpm, dir) => {
      bpmSlider.value = newBpm;
      bpmInput.value = newBpm;
      ladderStatusText.textContent = dir > 0 ? `▲ (${newBpm})` : `▼ (${newBpm})`;
    };

    micToggleBtn.addEventListener('click', async () => {
      if (!detector) {
        detector = new GuitarDetector(metronome.audioCtx, metronome);
        detector.latencyOffsetMs = parseInt(latencySlider.value, 10);

        detector.onLevelUpdate = (level) => {
          const pct = Math.round(level * 100);
          micLevelBar.style.width = pct + '%';
          levelValue.textContent = pct + '%';
        };

        detector.onAccuracyResult = (res) => {
          accuracyBadge.className = 'accuracy-badge ' + res.category;
          if (res.category === 'perfect') accuracyBadge.textContent = 'TÖKÉLETES';
          else if (res.category === 'early') accuracyBadge.textContent = 'SIETSZ!';
          else accuracyBadge.textContent = 'KÉSEL!';

          const sign = res.diffMs > 0 ? '+' : '';
          offsetFeedback.textContent = `${sign}${res.diffMs} ms`;
          accuracyStats.textContent = `${res.scorePercent}% (${res.totalStrums} pengetés)`;
        };
      }

      if (!detector.isActive) {
        const ok = await detector.start();
        if (ok) {
          micToggleBtn.classList.add('active');
          micToggleBtn.textContent = '🎙️ Érzékelő: BE';
          accuracyBadge.textContent = 'Figyelés...';
        }
      } else {
        detector.stop();
        micToggleBtn.classList.remove('active');
        micToggleBtn.textContent = '🎙️ Érzékelő: KI';
        accuracyBadge.className = 'accuracy-badge';
        accuracyBadge.textContent = 'Inaktív';
        micLevelBar.style.width = '0%';
        levelValue.textContent = '0%';
      }
    });

    latencySlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      offsetLabel.textContent = (val > 0 ? '+' : '') + val + ' ms';
      if (detector) detector.latencyOffsetMs = val;
    });

    sensitivitySlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      let label = 'Közepes';
      if (val < 35) label = 'Alacsony';
      else if (val > 70) label = 'Magas';
      sensLabel.textContent = label;
      if (detector) detector.threshold = 0.14 - ((val / 100) * 0.125);
    });

    document.querySelectorAll('#timerPresetsContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#timerPresetsContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mins = parseInt(btn.dataset.time, 10);
        metronome.timerMinutes = mins;
        timerCountdown.textContent = mins === 0 ? 'Végtelen' : `${mins}:00`;
      });
    });

    metronome.onTimerUpdate = (msRemaining) => {
      const totalSec = Math.ceil(msRemaining / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      timerCountdown.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    };

    metronome.onSessionComplete = () => {
      playBtn.textContent = 'Indítás';
      playBtn.classList.remove('playing');
      clearHighlights();
      timerCountdown.textContent = 'Idő lejárt!';
    };

    function renderIndicators() {
      indicatorsContainer.innerHTML = '';
      const totalSteps = metronome.beatsPerBar * metronome.subdivision;

      for (let i = 0; i < totalSteps; i++) {
        const col = document.createElement('div');
        col.className = 'beat-col';

        const isBeat = (i % metronome.subdivision === 0);
        const dot = document.createElement('div');

        if (isBeat) {
          dot.className = 'beat-dot main-beat';
        } else {
          dot.className = 'beat-dot sub';
          col.classList.add('is-subdivision');
        }

        const arrow = document.createElement('div');
        arrow.className = 'strum-arrow';

        const isDown = (metronome.strumPattern === 'down') || (i % 2 === 0);
        if (isDown) {
          col.classList.add('strum-down');
          arrow.textContent = '↓';
        } else {
          col.classList.add('strum-up');
          arrow.textContent = '↑';
        }

        col.appendChild(dot);
        col.appendChild(arrow);
        indicatorsContainer.appendChild(col);
      }
    }

    document.querySelectorAll('#beatsContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#beatsContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.beatsPerBar = parseInt(btn.dataset.beats, 10);
        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#subdivContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#subdivContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.subdivision = parseInt(btn.dataset.sub, 10);
        metronome.currentStep = 0;
        renderIndicators();
      });
    });

    document.querySelectorAll('#strumContainer .toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#strumContainer .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        metronome.strumPattern = btn.dataset.strum;
        renderIndicators();
      });
    });

    playBtn.addEventListener('click', () => {
      if (!metronome.isPlaying) {
        updateLadderSettings();
        metronome.start();
        playBtn.textContent = 'Leállítás';
        playBtn.classList.add('playing');
        trainerStatus.textContent = '';
      } else {
        metronome.stop();
        playBtn.textContent = 'Indítás';
        playBtn.classList.remove('playing');
        clearHighlights();
        indicatorsContainer.classList.remove('training-wheels-off');
        trainerStatus.textContent = '';
        ladderStatusText.textContent = '';
      }
    });

    let tapTimes = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        updateBpm(Math.round(60000 / avgInterval));
      }
    });

    function clearHighlights() {
      document.querySelectorAll('.beat-col').forEach(col => col.classList.remove('active'));
    }

    metronome.onTick = (note) => {
      const cols = indicatorsContainer.children;
      clearHighlights();

      if (note.wheelsOff) {
        indicatorsContainer.classList.add('training-wheels-off');
        trainerStatus.textContent = 'Önálló mód!';
      } else {
        indicatorsContainer.classList.remove('training-wheels-off');
      }

      if (cols[note.step] && !note.muted) {
        cols[note.step].classList.add('active');
      }
    };

    function renderLoop() {
      metronome.updateVisuals();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    renderIndicators();
  </script>
</body>
</html>
